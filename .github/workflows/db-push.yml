# ─────────────────────────────────────────────────────────────────────────────
# Auto-apply Supabase migrations per environment
#
# Trigger      Env    Approval    Notes
# ───────────  ─────  ──────────  ──────────────────────────────────────────────
# push main    Dev    none        Auto-applies as soon as merge lands
# push staging UAT    none        Auto-applies as soon as merge lands
# push prod    Prod   REQUIRED    Waits for approver via GitHub Environment
#
# Setup (one-time):
#   1. GitHub repo → Settings → Environments → create three envs:
#        - dev            (no protection rules)
#        - uat            (optional: require reviewers)
#        - production     (require reviewers — MUST)
#   2. In each environment → add secrets:
#        - SUPABASE_ACCESS_TOKEN   (personal access token from
#                                   https://supabase.com/dashboard/account/tokens)
#        - SUPABASE_DB_PASSWORD    (DB password, from Supabase Dashboard →
#                                   Settings → Database)
#   3. In each environment → add variable:
#        - SUPABASE_PROJECT_REF    (dev = etmnumptfadkynbsgszz,
#                                   uat = okpnubnswpgybpzgwgtr,
#                                   prod = <fill when created>)
# ─────────────────────────────────────────────────────────────────────────────

name: Push DB migrations

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-push.yml'
  workflow_dispatch:   # allow manual re-runs from the Actions tab

jobs:
  # ── Determine which env to target based on branch ──────────────────────────
  choose-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
    steps:
      - id: pick
        run: |
          case "${{ github.ref_name }}" in
            main)       echo "env=dev" >> $GITHUB_OUTPUT ;;
            staging)    echo "env=uat" >> $GITHUB_OUTPUT ;;
            production) echo "env=production" >> $GITHUB_OUTPUT ;;
            *)          echo "env=" >> $GITHUB_OUTPUT ;;
          esac

  # ── Actual push job (runs against the chosen env) ──────────────────────────
  push-migrations:
    needs: choose-env
    if: needs.choose-env.outputs.env != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.choose-env.outputs.env }}   # gates on env's protection rules
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show target
        run: |
          echo "── Target environment: ${{ needs.choose-env.outputs.env }}"
          echo "── Project ref:        ${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Link to Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Dry-run — list pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "── Migrations that would be applied:"
          supabase migration list --linked || true

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --linked --yes --include-all

      - name: Confirm
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "── Post-push state:"
          supabase migration list --linked | tail -20
