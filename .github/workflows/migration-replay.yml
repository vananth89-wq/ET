# ─────────────────────────────────────────────────────────────────────────────
# Clean-replay check for supabase/migrations
#
# WHY THIS EXISTS
#   On 2026-08-07 a holiday failed to display for a week. Root cause: migration
#   710 had aborted partway on Dev, leaving a table created but its functions
#   missing, and later migrations queried a column that migration 709 drops.
#   Nothing ever asked "do these files still apply to an empty database?"
#   This job asks, on every PR, and fails the moment they stop.
#
# WHAT IT DOES
#   Replays every versioned migration, in filename order, into a throwaway
#   PostgreSQL 16, on top of a prelude that stands in for the Supabase platform
#   (auth schema, roles, extensions). Reports every failure, not just the first.
#
# NOT A DEPLOY. It touches no real environment and holds no secrets.
#
# HOW IT JUDGES
#   Not pass/fail against zero — a gate nobody can pass is a gate everybody
#   learns to ignore. It ratchets instead: BASELINE is the agreed number of
#   known failures, a run above it fails the build, and a run below it passes
#   and tells you to lower BASELINE. The number only ever goes down.
#
#   152 -> 8 on 2026-08-09, by creating the five RBAC tables and the work
#   schedule tables early enough, shimming pg_net/pg_cron, and repairing two
#   migrations that could never have applied. The eight that remain are
#   itemised in docs/migration-replay-backlog.md, each with its own diagnosis.
# ─────────────────────────────────────────────────────────────────────────────

name: Migration replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migration-replay.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

env:
  # The ratchet. A run ABOVE this number fails the build; a run BELOW it passes
  # with a note telling you to lower the number and lock the improvement in.
  # Zero is the destination, not the gate -- a gate you cannot pass today is a
  # gate people learn to ignore.
  #
  #   2026-08-07  157   before the holiday-source fix
  #   2026-08-09  152   after mig 726 (+1: 726 itself, cascading)
  #   2026-08-09    8   after the RBAC tables, the work-schedule ordering fix,
  #                     the pg_net/pg_cron shims, and the 564/724 repairs
  BASELINE: '8'

jobs:
  replay:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Install replay shims for pg_net and pg_cron
        run: |
          # Stock PostgreSQL has neither extension, so `CREATE EXTENSION pg_net`
          # fails and takes its migration with it -- along with everything that
          # depends on the columns it would have created. No migration depends on
          # their RUNTIME behaviour at apply time, only on the statement parsing
          # and on the objects existing, and the prelude below provides those.
          #
          # The database is a SERVICE CONTAINER, not the runner. The control files
          # have to land inside THAT container's share directory. Writing them on
          # the runner filesystem looks like it works and does nothing at all --
          # which is exactly what run #5 did: 12 failures instead of 8, the four
          # extras being pg_net, pg_cron and the two that cascade from them.
          mkdir -p /tmp/shim
          for e in pg_net pg_cron; do
            printf "comment = 'replay shim for %s'\ndefault_version = '1.0'\nrelocatable = false\nsuperuser = false\n" "$e" > "/tmp/shim/$e.control"
            echo "-- shim: the objects live in the replay prelude" > "/tmp/shim/$e--1.0.sql"
          done

          CID=$(docker ps --filter "ancestor=postgres:16" --format '{{.ID}}' | head -1)
          if [ -z "$CID" ]; then
            echo "::error::postgres:16 service container not found -- cannot install the replay shims."
            exit 1
          fi

          EXT="$(docker exec "$CID" pg_config --sharedir)/extension"
          for f in /tmp/shim/*; do docker cp "$f" "$CID:$EXT/"; done

          # Prove it landed. A shim that silently fails is worse than no shim:
          # it turns a known-cause failure into an unexplained one.
          docker exec "$CID" test -f "$EXT/pg_net.control"  || { echo "::error::pg_net shim not present in the container";  exit 1; }
          docker exec "$CID" test -f "$EXT/pg_cron.control" || { echo "::error::pg_cron shim not present in the container"; exit 1; }
          echo "shims installed in $EXT inside container $CID"

      - name: Apply the Supabase platform prelude
        env:
          PGPASSWORD: postgres
        run: |
          # Everything the hosted platform provides before the first project
          # migration runs. pg_net and pg_cron are stubbed — they are not
          # available in a stock postgres image and no migration depends on
          # their behaviour at apply time, only on the calls parsing.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE SCHEMA IF NOT EXISTS supabase_functions;
          CREATE SCHEMA IF NOT EXISTS cron;
          CREATE SCHEMA IF NOT EXISTS net;

          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS btree_gist;

          DO $$ BEGIN CREATE ROLE anon NOLOGIN NOINHERIT;                    EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN NOINHERIT;           EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;  EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE supabase_admin SUPERUSER;                  EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticator NOINHERIT;                   EXCEPTION WHEN duplicate_object THEN NULL; END $$;

          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text, raw_user_meta_data jsonb, raw_app_meta_data jsonb,
            encrypted_password text, email_confirmed_at timestamptz,
            created_at timestamptz DEFAULT now(), updated_at timestamptz DEFAULT now(),
            last_sign_in_at timestamptz, confirmation_token text, recovery_token text,
            aud text, role text, instance_id uuid, is_super_admin boolean,
            banned_until timestamptz, deleted_at timestamptz, phone text);
          CREATE TABLE IF NOT EXISTS auth.identities (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid REFERENCES auth.users(id), provider text,
            identity_data jsonb, created_at timestamptz DEFAULT now());

          CREATE OR REPLACE FUNCTION auth.uid()   RETURNS uuid  LANGUAGE sql STABLE AS $f$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $f$;
          CREATE OR REPLACE FUNCTION auth.role()  RETURNS text  LANGUAGE sql STABLE AS $f$ SELECT COALESCE(NULLIF(current_setting('request.jwt.claim.role', true), ''), 'authenticated') $f$;
          CREATE OR REPLACE FUNCTION auth.jwt()   RETURNS jsonb LANGUAGE sql STABLE AS $f$ SELECT COALESCE(NULLIF(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $f$;
          CREATE OR REPLACE FUNCTION auth.email() RETURNS text  LANGUAGE sql STABLE AS $f$ SELECT NULLIF(current_setting('request.jwt.claim.email', true), '') $f$;

          CREATE OR REPLACE FUNCTION net.http_post(url text, body jsonb DEFAULT '{}', params jsonb DEFAULT '{}', headers jsonb DEFAULT '{}', timeout_milliseconds int DEFAULT 5000)
            RETURNS bigint LANGUAGE sql AS $f$ SELECT 1::bigint $f$;
          CREATE OR REPLACE FUNCTION net.http_get(url text, params jsonb DEFAULT '{}', headers jsonb DEFAULT '{}', timeout_milliseconds int DEFAULT 5000)
            RETURNS bigint LANGUAGE sql AS $f$ SELECT 1::bigint $f$;
          CREATE TABLE IF NOT EXISTS net._http_response (id bigint, status_code int, content text, created timestamptz DEFAULT now());
          -- cron.schedule must RECORD the job, not just return a number: several
          -- migrations schedule a job and then verify it exists in cron.job. A
          -- stub that always returned 1 left that table empty and those
          -- verification blocks aborted on a database that was in fact fine.
          CREATE TABLE IF NOT EXISTS cron.job (jobid bigserial, jobname text, schedule text, command text, active boolean DEFAULT true);
          CREATE OR REPLACE FUNCTION cron.schedule(job_name text, schedule text, command text) RETURNS bigint LANGUAGE plpgsql AS $f$
          BEGIN
            DELETE FROM cron.job WHERE jobname = job_name;
            INSERT INTO cron.job (jobname, schedule, command) VALUES (job_name, schedule, command);
            RETURN (SELECT jobid FROM cron.job WHERE jobname = job_name);
          END $f$;
          CREATE OR REPLACE FUNCTION cron.unschedule(job_name text) RETURNS boolean LANGUAGE sql AS $f$ DELETE FROM cron.job WHERE jobname = job_name; SELECT true $f$;
          CREATE OR REPLACE FUNCTION cron.unschedule(job_id bigint)                            RETURNS boolean LANGUAGE sql AS $f$ SELECT true $f$;
          CREATE TABLE IF NOT EXISTS storage.buckets (id text PRIMARY KEY, name text, public boolean DEFAULT false,
            file_size_limit bigint, allowed_mime_types text[], created_at timestamptz DEFAULT now());
          CREATE TABLE IF NOT EXISTS storage.objects (id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text, name text, owner uuid, created_at timestamptz DEFAULT now(), metadata jsonb);
          CREATE OR REPLACE FUNCTION storage.foldername(name text) RETURNS text[] LANGUAGE sql IMMUTABLE AS $f$ SELECT string_to_array(name, '/') $f$;

          GRANT USAGE ON SCHEMA public, auth, extensions, storage, net, cron TO anon, authenticated, service_role;
          SQL
          echo "prelude applied"

      - name: Replay every migration
        env:
          PGPASSWORD: postgres
        run: |
          # GitHub runs steps as `bash -e`. This loop DELIBERATELY tolerates
          # failing migrations — and `grep` exits 1 whenever a migration applies
          # cleanly (no ERROR line to match), which under errexit killed the
          # script on the very first success. Turn errexit off explicitly.
          set +e
          set -o pipefail
          ok=0; fail=0
          : > /tmp/failures.txt
          # Only versioned files (NNNNNNNNNNN_*.sql). Loose scratch files in the
          # directory are not part of the history and are skipped deliberately.
          for f in $(ls supabase/migrations/*.sql | grep -E '/[0-9]{11}_' | sort); do
            name=$(basename "$f")
            err=$(psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1 \
                    -f "$f" 2>&1 >/dev/null | grep -m1 -E "ERROR:" | sed 's/.*ERROR:  //')
            if [ -z "$err" ]; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              printf '%s\n    %s\n' "$name" "$err" >> /tmp/failures.txt
            fi
          done
          echo "replayed=$((ok+fail)) ok=$ok failed=$fail"
          echo "REPLAY_FAILED=$fail" >> $GITHUB_ENV

          {
            echo "## Migration replay"
            echo ""
            echo "| replayed | applied | failed |"
            echo "|---|---|---|"
            echo "| $((ok+fail)) | $ok | **$fail** |"
            if [ "$fail" -gt 0 ]; then
              echo ""
              echo "<details><summary>Failures</summary>"
              echo ""
              echo '```'
              cat /tmp/failures.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> $GITHUB_STEP_SUMMARY

          # A shell step's exit code is its LAST command's. The block above ends
          # in an `if` that is false when nothing failed, which would mark a
          # perfectly clean replay as a failure. Be explicit: this step reports,
          # it does not judge. The Verdict step decides.
          exit 0

      - name: Verdict
        run: |
          if [ "${REPLAY_FAILED}" -eq 0 ]; then
            echo "Clean replay - the migration history builds a database from zero."
            echo "Set BASELINE to 0 so it stays that way."
            exit 0
          fi
          if [ "${REPLAY_FAILED}" -gt "${BASELINE}" ]; then
            echo "::error::${REPLAY_FAILED} migrations failed to replay, above the baseline of ${BASELINE}."
            echo "This change made the migration history worse. See the job summary for which files."
            exit 1
          fi
          if [ "${REPLAY_FAILED}" -lt "${BASELINE}" ]; then
            echo "::notice::${REPLAY_FAILED} failures - BELOW the baseline of ${BASELINE}."
            echo "Lower BASELINE in this workflow to ${REPLAY_FAILED} to lock the improvement in."
            exit 0
          fi
          echo "::warning::${REPLAY_FAILED} migrations failed to replay - exactly the baseline of ${BASELINE}."
          echo "Not a regression. The remaining failures are itemised in docs/migration-replay-backlog.md."
          exit 0
